<script>
    // Paste your complete Web App URL here
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyqLxtmD2t6FX9ZPxNlhS3cwyMS5f4b8XSPch15WAC3hCzM06rqfGww8gBI02J7-SQ/exec';

    document.getElementById('messageForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const message = document.getElementById('message').value;
        const statusText = document.getElementById('status');
        
        statusText.innerText = 'Sending message...';

        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ message: message })
            });

            const result = await response.json();

            if (result.status === 'success') {
                statusText.innerText = 'Message sent successfully!';
                document.getElementById('message').value = '';
            } else {
                statusText.innerText = 'Failed to send message.';
                console.error("Error:", result.message);
            }
        } catch (error) {
            console.error("Network Error:", error);
            statusText.innerText = 'Connection error. Please try again.';
        }
    });
</script>
