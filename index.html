<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Car Owner</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            text-align: center; 
            background-color: #f4f4f9;
        }
        .container {
            max-width: 350px; 
            margin: 50px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        textarea { 
            width: 100%; 
            height: 120px; 
            margin-bottom: 15px; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            resize: none;
        }
        button { 
            width: 100%;
            padding: 12px; 
            background-color: #0088cc; 
            color: white; 
            border: none; 
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer; 
        }
        button:hover {
            background-color: #006699;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚗 Contact Car Owner</h2>
        <p style="font-size: 14px; color: #666;">Scan successful! Leave a note for the car owner below.</p>
        
        <form id="messageForm">
            <textarea id="message" placeholder="Type your message here (e.g., You are parked blocking my driveway)..." required></textarea>
            <br>
            <button type="submit">Send Message</button>
        </form>

        <p id="status"></p>
    </div>

    <script>
        // Updated with your new Google Apps Script Web App URL
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw3NgnRd8TFQD4ITfVUBAYPEyBB68iSvV6CQwS6NShhLc4DBc1HqHnjaVPPeRo8V-g/exec';

        document.getElementById('messageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageInput = document.getElementById('message');
            const statusText = document.getElementById('status');
            const message = messageInput.value.trim();
            
            if (!message) return;
            
            statusText.style.color = '#0088cc';
            statusText.innerText = 'Sending message...';

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                statusText.style.color = 'green';
                statusText.innerText = 'Message sent successfully! Owner notified.';
                messageInput.value = '';

            } catch (error) {
                console.error("Network Error:", error);
                statusText.style.color = 'red';
                statusText.innerText = 'Connection error. Please try again.';
            }
        });
    </script>
</body>
</html>
